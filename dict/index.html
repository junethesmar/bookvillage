<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영어 표현 도감</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Bagel+Fat+One&family=DM+Mono:wght@400;500&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one framed "plate" holding a hand-inked device that carries its own sentences, English action buttons beside it, a fig index strip below. Single printed-paper look, deliberately light-only. */
:root{
  color-scheme: light;
  --paper:#ECEEE6;
  --paper-2:#E1E5D9;
  --ink:#1E2336;
  --ink-soft:#565C72;
  --teal:#2E9C93;
  --yellow:#FFD23F;
  --pink:#F15060;
  --grid:rgba(30,35,54,.12);
  --f-display:"Bagel Fat One","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-en:"Andika","Gowun Dodum",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;word-break:keep-all;
  -webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{-webkit-user-select:none;user-select:none;white-space:nowrap}
button:focus:not(:focus-visible){outline:none}
/* one screen: everything is sized from the viewport height (1em ≈ 2.1vh) */
.wrap{--u:clamp(12px,2.1vh,24px);font-size:var(--u);
  height:100vh;height:100dvh;max-width:max(1080px,150vh);margin:0 auto;padding-block:1.1em .9em;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.55em;line-height:1;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-mono);font-size:.42em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:.5em}
.pager{display:flex;align-items:center;gap:.6em;font-family:var(--f-mono);font-size:.82em;font-variant-numeric:tabular-nums}
.pager button{width:2.3em;height:2.3em;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:50%;font-size:1em;cursor:pointer}
.pager button:disabled{cursor:not-allowed;opacity:.35}
.pager button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

.sheet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1.8em;min-height:0}

.plate{border:1.5px solid var(--ink);border-radius:6px;background-color:#F3F4EE;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.3px);background-size:16px 16px;
  padding:.6em .6em .7em;display:flex;flex-direction:column;gap:.35em;min-width:0;min-height:0}
.plate svg{flex:1 1 auto;min-height:0;width:100%;height:100%;display:block;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding:0 .25em;font-family:var(--f-mono);font-size:.72em;letter-spacing:.06em;color:var(--ink-soft)}
.cap b{color:var(--ink);font-weight:500}
.hint{margin:0;padding:0 .25em;font-size:.88em;color:var(--ink)}
.hint::before{content:"☞ ";color:var(--pink)}


.index .ix:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

.index{display:flex;flex-wrap:wrap;gap:.2em 1.1em;padding-top:.6em;border-top:1.5px solid var(--ink);font-size:.8em}
.index span,.index .ix{display:inline-flex;gap:.35em;align-items:baseline;color:var(--ink-soft)}
.index span{opacity:.45}
.index .ix{font:inherit;background:none;border:0;padding:0;cursor:pointer}
.index i{font-style:normal;font-family:var(--f-mono);font-size:.8em}
.index .cur{color:var(--ink);font-weight:700}

@media (max-aspect-ratio:3/2) and (min-width:821px){.wrap{--u:clamp(12px,1.85vh,22px)}}
/* stage layout: the device is the whole page, English action buttons on the left */
.acts{display:none}
.sheet.stage{grid-template-columns:minmax(0,1fr)}
.sheet.stage .plate{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:.5em 1.2em;padding:.9em 1.1em}
.sheet.stage .cap{grid-column:1 / -1;grid-row:1}
.sheet.stage .acts{display:flex;flex-direction:column;align-items:flex-start;gap:.55em;grid-column:1;grid-row:2;padding-top:.3em}
.sheet.stage .plate svg{grid-column:2;grid-row:2}
.sheet.stage .hint{grid-column:1 / -1;grid-row:3}
.act{font:inherit;font-family:var(--f-en);font-size:1em;display:flex;flex-direction:column;align-items:flex-start;gap:.05em;padding:.45em 1.1em .5em;border:1.5px solid var(--ink);border-radius:1.4em;background:#F7F8F3;color:var(--ink);cursor:pointer;line-height:1.15}
.act small{font-family:var(--f-body);font-size:.68em;color:var(--ink-soft)}
.act:disabled{opacity:.35;cursor:not-allowed}
.act:not(:disabled):active{background:var(--paper-2)}
.act.mini{margin-top:auto;font-family:var(--f-body);font-size:.75em;padding:.35em .9em;background:transparent;color:var(--ink-soft)}
.act:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

/* phones / narrow: stack and let the page scroll */
@media (max-width:820px){
  .wrap{--u:15px;height:auto;display:flex;flex-direction:column}
  .sheet{grid-template-columns:minmax(0,1fr);gap:1.2em}
  .plate svg{height:auto;max-height:60vh}
  .sheet.stage .plate{grid-template-columns:minmax(0,1fr)}
  .sheet.stage .acts{flex-direction:row;flex-wrap:wrap;grid-row:3}
  .sheet.stage .plate svg{grid-column:1}
  .sheet.stage .hint{grid-row:4}
}

.hit{cursor:pointer;outline:none}
.hit:focus-visible{stroke:var(--pink);stroke-width:2.5;vector-effect:non-scaling-stroke}
#inkL *,#fillL *{vector-effect:non-scaling-stroke}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">영어 표현 도감<small>Everyday English · Illustrated</small></div>
    <nav class="pager" aria-label="그림 넘기기">
      <button id="prev" type="button" aria-label="이전 그림">←</button>
      <span id="pgNum">Fig. 01 / 12</span>
      <button id="next" type="button" aria-label="다음 그림">→</button>
    </nav>
  </header>

  <main class="sheet stage" id="sheet">
    <section class="plate" id="plate">
      <div class="acts" id="acts"></div>
      <svg id="art" role="img"></svg>
      <div class="cap"><span id="capName"></span><span id="capKeys"></span></div>
      <p class="hint" id="hint"></p>
    </section>
  </main>

  <footer class="index" id="index"></footer>
</div>

<script>
(function(){
  const INK='#1E2336';

  /* ================= iso engine ================= */
  function Iso(ox,oy,fillFilter){
    const s=14,c=0.8660254;
    const P=(x,y,z)=>[ox+(x-y)*c*s, oy+(x+y)*0.5*s - z*s];
    const mat=(a,b,cc,d,[e,f])=>`matrix(${a},${b},${cc},${d},${e.toFixed(2)},${f.toFixed(2)})`;
    const M={},F=[],K=[],X=[],D=[],T=[];
    const tf=pl=>pl==='scr'?'':` transform="${M[pl]}"`;
    const attrs=a=>Object.entries(a).map(([k,v])=>`${k}="${typeof v==='number'?+v.toFixed(3):v}"`).join(' ');
    function el(pl,tag,a,fill,o={}){
      const cls=o.cls?` class="${o.cls}"`:'';
      const at=attrs(a);
      if(fill&&!o.inkOnly) F.push(`<${tag}${tf(pl)}${cls} ${at} fill="${fill}"/>`);
      if(!o.fillOnly) K.push(`<${tag}${tf(pl)}${cls} ${at} fill="${o.inkFill||'none'}"/>`);
    }
    const rect=(pl,x,y,w,h,f,o={})=>el(pl,'rect',Object.assign({x,y,width:w,height:h},o.rx?{rx:o.rx}:{}),f,o);
    const poly=(pl,pts,f,o)=>el(pl,'polygon',{points:pts.map(p=>p.map(n=>+n.toFixed(2)).join(',')).join(' ')},f,o);
    const circ=(pl,cx,cy,r,f,o)=>el(pl,'circle',{cx,cy,r},f,o);
    const path=(pl,d,f,o)=>el(pl,'path',{d},f,o);
    const ell=(pl,cx,cy,rx,ry,f,o)=>el(pl,'ellipse',{cx,cy,rx,ry},f,o);
    function txt(pl,x,y,str,size,color,font,extra=''){
      K.push(`<text${tf(pl)} x="${x}" y="${y}" font-size="${size}" fill="${color||INK}" font-family="${font}" text-anchor="middle" ${extra}>${str}</text>`);
    }
    const g=a=>{F.push(`<g ${a}>`);K.push(`<g ${a}>`)};
    const gc=()=>{F.push('</g>');K.push('</g>')};
    function cyl(x,y,z,r,h,body,band,o={}){
      const [bx,by]=P(x,y,z),[,ty]=P(x,y,z+h),[,y1]=P(x,y,z+h*.34),[,y2]=P(x,y,z+h*.72);
      const rx=1.2247*r*s, ry=.7071*r*s, f=n=>+n.toFixed(2);
      path('scr',`M${f(bx-rx)},${f(ty)}L${f(bx-rx)},${f(by)}A${f(rx)},${f(ry)} 0 0 0 ${f(bx+rx)},${f(by)}L${f(bx+rx)},${f(ty)}A${f(rx)},${f(ry)} 0 0 0 ${f(bx-rx)},${f(ty)}Z`,body,{cls:o.bodyCls});
      path('scr',`M${f(bx-rx)},${f(y2)}L${f(bx-rx)},${f(y1)}A${f(rx)},${f(ry)} 0 0 0 ${f(bx+rx)},${f(y1)}L${f(bx+rx)},${f(y2)}A${f(rx)},${f(ry)} 0 0 1 ${f(bx-rx)},${f(y2)}Z`,band,{cls:o.bandCls});
      rect('scr',bx-rx*.6,ty+ry*.9,1.6,by-ty-ry*.6,'rgba(255,255,255,.6)',{fillOnly:true});
      ell('scr',bx,ty,rx,ry,'#D9DDE0');
      ell('scr',bx+rx*.28,ty+ry*.05,rx*.34,ry*.36,null,{inkOnly:true});
    }
    const hit=(pl,a)=>X.push(`<rect class="hit"${tf(pl)} ${a} fill="transparent"/>`);
    function svg(){
      return `<defs>
        <filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
        <filter id="wob2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="2"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
        <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><line x1="0" y1="0" x2="0" y2="5" stroke="${INK}" stroke-width="1.1" opacity=".55"/></pattern>
        <filter id="hand" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="2" result="warp"/>
          <feDisplacementMap in="SourceGraphic" in2="warp" scale="1.4" xChannelSelector="R" yChannelSelector="G" result="wob"/>
          <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="3" seed="11" result="n1"/>
          <feColorMatrix in="n1" type="matrix" values=".3 0 0 0 .82  .3 0 0 0 .82  .3 0 0 0 .82  0 0 0 0 1" result="grain"/>
          <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="7" result="n2"/>
          <feColorMatrix in="n2" type="matrix" values=".3 0 0 0 .84  .3 0 0 0 .84  .3 0 0 0 .84  0 0 0 0 1" result="blot"/>
          <feBlend in="wob" in2="grain" mode="multiply" result="g1"/>
          <feBlend in="g1" in2="blot" mode="multiply" result="g2"/>
          <feComposite in="g2" in2="wob" operator="in"/>
        </filter>
        ${D.join('')}
      </defs><g id="fig"><g id="fillL" filter="url(#${fillFilter||'wob2'})" transform="translate(1.6,1.1)">${F.join('')}</g><g id="inkL" filter="url(#wob)" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">${K.join('')}</g><g id="txtL">${T.join('')}</g></g><g id="hitL">${X.join('')}</g>`;
    }
    return {s,c,P,M,F,K,X,D,T,el,rect,poly,circ,path,ell,txt,g,gc,cyl,hit,svg,
      front:(x,y,z)=>mat(c*s,.5*s,0,s,P(x,y,z)),
      right:(x,y,z)=>mat(c*s,-.5*s,0,s,P(x,y,z)),
      top:(x,y,z)=>mat(c*s,.5*s,-c*s,.5*s,P(x,y,z))};
  }

  /* ================= shared UI ================= */
  const $=id=>document.getElementById(id);
  const art=$('art'),hintEl=$('hint');
  const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let timers=[],running=[],rafs=[],lines=[],stepN=-1,koOn=true;

  const synth=window.speechSynthesis;let voice=null;
  function pick(){
    if(!synth) return;
    const vs=synth.getVoices();
    voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google US English|Jenny|Aria|Ava|Zira/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
  }
  if(synth){pick();synth.onvoiceschanged=pick}
  const utt=(t,pitch,rate)=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.pitch=pitch||1;u.rate=rate||.82;return u};

  /* voice: recorded mp3 at audio/<slug>.mp3 first, browser speech when the file is missing */
  const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  let vq=[],vEl=null,vGen=0;
  function stopVoice(){vGen++;vq=[];if(vEl){vEl.pause();vEl=null}if(synth)synth.cancel()}
  function playVoice(items){
    stopVoice();const gen=vGen;vq=items.slice();next();
    function next(){
      if(gen!==vGen)return;
      const it=vq.shift();if(!it)return;
      const a=new Audio(`audio/${slug(it.t)}.mp3`);vEl=a;let fell=false;
      const fallback=()=>{
        if(fell||gen!==vGen)return;fell=true;vEl=null;
        if(!synth){it.on&&it.on();next();return}
        const u=utt(it.t,it.p,it.r);u.onstart=()=>it.on&&it.on();u.onend=u.onerror=next;synth.speak(u);
      };
      a.onplay=()=>it.on&&it.on();
      a.onended=()=>{if(gen===vGen)next()};
      a.onerror=fallback;
      a.play().catch(fallback);
    }
  }

  let ac=null;
  function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){ac=null}return ac}
  function blip(freq=1100){const a=audio();if(!a)return;const o=a.createOscillator(),v=a.createGain();o.frequency.value=freq;v.gain.setValueAtTime(.08,a.currentTime);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+.06);o.connect(v).connect(a.destination);o.start();o.stop(a.currentTime+.07)}
  function clunk(){const a=audio();if(!a)return;const len=a.sampleRate*.18,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);const n=a.createBufferSource();n.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=520;const v=a.createGain();v.gain.value=.9;n.connect(f).connect(v).connect(a.destination);n.start()}
  function noise(sec,type,from,to,gain){const a=audio();if(!a)return;const len=a.sampleRate*sec,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/len);const n=a.createBufferSource();n.buffer=b;const f=a.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(from,a.currentTime);f.frequency.exponentialRampToValueAtTime(to,a.currentTime+sec);const v=a.createGain();v.gain.value=gain;n.connect(f).connect(v).connect(a.destination);n.start()}

  const ui={
    art,
    dur:n=>RM?1:n,
    later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t},
    anim(sel,frames,opt){const a=[...art.querySelectorAll(sel)].map(e=>e.animate(frames,opt));running.push(...a);return a},
    all:sel=>art.querySelectorAll(sel),
    show(sel,on){art.querySelectorAll(sel).forEach(e=>e.style.display=on?'':'none')},
    hint(t){hintEl.textContent=t},
    step(n){stepN=n},
    speak(list){playVoice(list.map(([t,p,r])=>({t,p,r})))},
    talk(idx,cb){
      ui.step(idx[0]);
      playVoice(idx.map(n=>{const L=lines[n];return {t:L.en,p:L.pitch,r:L.rate,on:()=>{ui.step(n);cb&&cb(n)}}}));
    },
    lines(ls){lines=ls},
    tween(ms,fn,done){
      const t0=performance.now();
      const tick=()=>{const t=Math.max(0,Math.min(1,(performance.now()-t0)/ms));fn(t);if(t<1)timers.push(setTimeout(tick,16));else if(done)done()};
      timers.push(setTimeout(tick,0));
    },
    isKo:()=>koOn,
    acts(fn){document.querySelectorAll('#acts .act').forEach(b=>{if(b.dataset.act!=='ko')b.disabled=!fn(b.dataset.act)})},
    audio,blip,clunk,
    swish:()=>noise(.24,'bandpass',800,3400,.55),
    poof:()=>noise(.3,'lowpass',1600,260,.7)
  };
  function flush(){
    timers.forEach(clearTimeout);timers=[];
    rafs.forEach(cancelAnimationFrame);rafs=[];
    running.forEach(a=>{try{a.cancel()}catch(e){}});running=[];
    stopVoice();
  }

  /* ---- shared talk board: a dark sign whose rows are the dialogue, drawn on the device ---- */
  function boardDraw(api,id,x,y,w,n,title){
    const {rect,K,F,T}=api,rh=40,h=24+n*rh;
    rect('scr',x,y,w,h,'#22323C',{rx:9});
    rect('scr',x+9,y+16,w-18,h-24,'#E8F6F3',{rx:4});
    T.push(`<text x="${x+14}" y="${y+11.5}" font-size="7.5" fill="#C9CDD8" font-family="DM Mono" letter-spacing=".12em">${title}</text>`);
    for(let i=0;i<n;i++){
      for(let k=0;k<2;k++){F.push(`<rect id="${id}s${i}${k}" width="0" height="0" rx="3"/>`);K.push(`<rect id="${id}s${i}${k}i" width="0" height="0" rx="3" fill="none"/>`)}
      const ty=y+38+i*rh;
      T.push(`<g id="${id}row${i}" class="${id}row" opacity=".3" style="transform-box:fill-box;transform-origin:50% 50%"><circle id="${id}d${i}" cx="${x+27}" cy="${ty-5}" r="4.5" fill="#FFD23F" stroke="${INK}" stroke-width="1.2"/>`
        +`<text id="${id}r${i}" x="${x+38}" y="${ty}" font-size="16" font-weight="700" fill="${INK}" font-family="Andika"></text>`
        +`<text id="${id}k${i}" x="${x+38}" y="${ty+12.5}" font-size="9.5" fill="#565C72" font-family="Gowun Dodum"></text></g>`);
    }
    return h;
  }
  /* rows: [{who:'a'|'b', parts:['text',{s:'slot',c:'#color'},...], ko, on}] */
  function boardSet(U,id,rows){
    const art=U.art,r2=n=>+n.toFixed(2);
    rows.forEach((r,i)=>{
      const t=art.querySelector(`#${id}r${i}`);if(!t)return;
      let text='';const slots=[];
      r.parts.forEach(q=>{if(typeof q==='string')text+=q;else{slots.push([text.length,q.s.length,q.c]);text+=q.s}});
      t.textContent=text;
      art.querySelector(`#${id}d${i}`).setAttribute('fill',r.who==='a'?'#FFD23F':'#2E9C93');
      const k=art.querySelector(`#${id}k${i}`);k.textContent=r.ko||'';k.style.display=U.isKo()?'':'none';
      art.querySelector(`#${id}row${i}`).setAttribute('opacity',r.on?1:.3);
      for(let j=0;j<2;j++){
        const R=art.querySelector(`#${id}s${i}${j}`),Ri=art.querySelector(`#${id}s${i}${j}i`),q=slots[j];
        if(!q||!q[1]){R.setAttribute('width',0);Ri.setAttribute('width',0);continue}
        try{
          const e1=t.getExtentOfChar(q[0]),e2=t.getExtentOfChar(q[0]+q[1]-1);
          const at={x:r2(e1.x-2.5),y:r2(e1.y+2),width:r2(e2.x+e2.width-e1.x+5),height:r2(e1.height-4.5)};
          [R,Ri].forEach(el=>Object.entries(at).forEach(([n,v])=>el.setAttribute(n,v)));
          R.setAttribute('fill',q[2]);
        }catch(e){}
      }
    });
  }

  /* ================= Fig. 01 vending machine ================= */
  const vending=(function(){
    const DR=[
      {en:'soda', ko:'탄산음료', body:'#F15060', band:'#FFF4E8', chip:'#F7A3AC'},
      {en:'juice',ko:'주스',     body:'#FF9B3D', band:'#FFE45C', chip:'#FFC98F'},
      {en:'milk', ko:'우유',     body:'#F6F6F0', band:'#4F86D9', chip:'#C9DBF5'},
      {en:'water',ko:'물',       body:'#9BD8F2', band:'#FFFFFF', chip:'#C7EAF8'}
    ];
    let U,cur=-1,busy=false,trayFull=false,anims={},lcd=null,credit=0,asked=false,landed=false,taken=false;
    const lineB='Sure. Here you are.',lineC='Thank you!';
    const textA=()=>`Can I have some ${cur<0?'____':DR[cur].en}?`;

    function draw(api){
      const {P,M,rect,poly,circ,txt,g,gc,cyl,hit,K}=api;
      const W=10,D=6,H=19;
      M.front=api.front(0,D,H);M.right=api.right(W,D,H);M.top=api.top(0,0,H);

      /* ground shadow */
      poly('scr',[P(W,0,0),P(W+3.2,0,0),P(W+3.2,D,0),P(W,D,0)],'rgba(30,35,54,.10)',{inkFill:'url(#hatch)'});
      /* right side */
      rect('right',0,0,D,H,'#1F756F');
      for(let i=0;i<5;i++) rect('right',1.4,13.6+i*.62,3.2,.24,'#165C57',{rx:.1});
      circ('right',3,6.2,1.35,'#F15060');
      txt('right',3,6.05,'ICE',.62,'#FFF4E8','Bagel Fat One');
      txt('right',3,6.75,'COLD',.5,'#FFF4E8','Bagel Fat One');
      /* top */
      rect('top',0,0,W,D,'#83CFC5');
      rect('top',.8,.8,W-1.6,D-1.6,'#9ADAD1',{rx:.3});
      /* front body */
      rect('front',0,0,W,H,'#2E9C93');
      rect('front',0,17.2,W,1.8,'#1F756F');
      for(let i=0;i<4;i++) rect('front',3.6+i*.7,17.75,.3,.75,'#165C57',{rx:.12});
      /* sign */
      rect('front',.6,.5,8.8,1.5,'#FFD23F',{rx:.3});
      txt('front',5,1.63,'COLD DRINKS',1.02,INK,'Bagel Fat One','letter-spacing=".06"');
      /* window */
      rect('front',.55,2.15,6.3,9.5,'#F7F8F3',{rx:.25});
      rect('front',.8,2.4,5.8,9,'#CBE6E4');

      const shelvesW=[11.0,8.2,5.4], cu=[0.6,2.0,3.4,4.8];
      g('clip-path="url(#winclip)"');
      shelvesW.forEach((w,r)=>{
        const v=H-w;
        poly('scr',[P(.6,6,v),P(7,6,v),P(7,4,v),P(.6,4,v)],'#E9F1EE');
        rect('front',.8,w,5.8,.36,'#B7CBC5');
        cu.forEach((u,i)=>{
          if(r===0) g(`class="dc dc${i}"`);
          cyl(u,5,v,.48,1.8,DR[i].body,DR[i].band);
          if(r===0) gc();
        });
        if(r===0) cu.forEach((u,i)=>{
          rect('front',u+1-.3,10.98,.6,.4,'#FFD23F',{rx:.08});
          txt('front',u+1,11.3,String(i+1),.36,INK,'DM Mono');
        });
      });
      gc();
      rect('front',.8,2.4,5.8,9,'rgba(255,255,255,.14)',{fillOnly:true});
      poly('front',[[1.5,11.4],[2.25,11.4],[4.85,2.4],[4.1,2.4]],'rgba(255,255,255,.5)',{fillOnly:true});
      poly('front',[[2.6,11.4],[2.85,11.4],[5.45,2.4],[5.2,2.4]],'rgba(255,255,255,.5)',{fillOnly:true});
      rect('front',.8,2.4,5.8,9,null,{inkOnly:true});

      /* button panel */
      rect('front',7.05,2.15,2.4,11,'#E6EBE4',{rx:.25});
      rect('front',7.3,2.5,1.9,1.35,'#22323C',{rx:.12});
      K.push(`<text id="lcd" transform="${M.front}" x="8.25" y="3.36" font-size=".4" fill="#8EF0B0" font-family="DM Mono" text-anchor="middle" letter-spacing=".04">SELECT</text>`);
      const btnW=[4.35,6.05,7.75,9.45];
      btnW.forEach((w,i)=>{
        g(`class="bt bt${i}"`);
        rect('front',7.35,w,1.8,1.35,'#F7F8F3',{rx:.25,cls:`bf bf${i}`});
        circ('front',7.95,w+.68,.36,DR[i].body);
        txt('front',8.62,w+.9,String(i+1),.62,INK,'DM Mono','font-weight="500"');
        gc();
      });
      rect('front',7.6,11.25,1.3,1.5,'#BAC5BF',{rx:.15});
      rect('front',8.12,11.5,.26,1,INK,{inkFill:INK,rx:.1});
      txt('front',8.25,13.05,'COIN',.34,INK,'DM Mono');

      /* dispenser tray */
      rect('front',.8,13.2,5.8,3.2,'#F7F8F3',{rx:.25});
      rect('front',1.2,13.6,5,2.3,'#263147');
      g('clip-path="url(#trayclip)"');
      g('class="tc" opacity="0"');
      cyl(3.0,5.2,2.6,.5,1.8,DR[0].body,DR[0].band,{bodyCls:'tcb',bandCls:'tcband'});
      gc();
      gc();
      rect('front',1.2,13.6,5,1.05,'rgba(220,235,240,.55)');
      txt('front',3.7,14.32,'PUSH',.45,'#4A5068','DM Mono','letter-spacing=".2"');
      rect('front',1.2,13.6,5,2.3,null,{inkOnly:true});

      /* hit areas */
      btnW.forEach((w,i)=>hit('front',`data-i="${i}" tabindex="0" role="button" aria-label="${i+1}번 ${DR[i].ko}" x="7.35" y="${w}" width="1.8" height="1.35"`));
      cu.forEach((u,i)=>hit('front',`data-i="${i}" tabindex="-1" aria-hidden="true" x="${u+.3}" y="8.6" width="1.4" height="2.4"`));
      hit('front',`id="trayHit" tabindex="0" role="button" aria-label="음료 꺼내기" x="1.2" y="13.6" width="5" height="2.3"`);

      /* coin (flies into the slot) */
      const [kx,ky]=P(8.25,D,H-12);
      api.el('scr','ellipse',{cx:+(kx+26).toFixed(2),cy:+(ky-14).toFixed(2),rx:5,ry:6.5,opacity:0},'#E3C46A',{cls:'coin'});
      hit('front',`id="coinHit" tabindex="0" role="button" aria-label="동전 넣기" x="7.5" y="11.15" width="1.5" height="1.75"`);
      /* talk board on an arm */
      K.push(`<path d="M222,140 L290,148" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round" style="vector-effect:none"/><path d="M222,140 L290,148" fill="none" stroke="#8D96A8" stroke-width="4" stroke-linecap="round" style="vector-effect:none"/>`);
      boardDraw(api,'v1',286,84,246,3,'TALK');

      api.D.push(`<clipPath id="winclip\" clipPathUnits="userSpaceOnUse"><rect transform="${M.front}" x=".8" y="2.4" width="5.8" height="9"/></clipPath>
        <clipPath id="trayclip" clipPathUnits="userSpaceOnUse"><rect transform="${M.front}" x="1.2" y="13.6" width="5" height="2.3"/></clipPath>`);
    }

    function dlgLines(){return [
      {who:'a',en:textA(),ko:cur<0?'':`${DR[cur].ko} 좀 주시겠어요?`,pitch:1.05},
      {who:'b',en:lineB,ko:'그럼요. 여기 있어요.',pitch:1.45,rate:.88},
      {who:'a',en:lineC,ko:'고맙습니다!',pitch:1.05}
    ]}
    function board(){
      boardSet(U,'v1',[
        {who:'a',parts:asked?['Can I have some ',{s:DR[cur].en,c:DR[cur].chip},'?']:['Can I have some ____?'],ko:asked?`${DR[cur].ko} 좀 주시겠어요?`:'',on:asked},
        {who:'b',parts:[lineB],ko:'그럼요. 여기 있어요.',on:landed},
        {who:'a',parts:[lineC],ko:'고맙습니다!',on:taken}
      ]);
      U.lines(dlgLines());
      U.acts(id=>id==='coin'?credit===0&&!trayFull:id==='press'?credit>0:id==='take'?trayFull:asked);
    }
    function coin(){
      if(trayFull){U.hint('먼저 음료를 꺼내 보세요.');return}
      if(credit>0){U.hint('동전이 들어 있어요. 번호 버튼을 눌러 보세요.');return}
      U.audio();credit=1;asked=landed=taken=false;
      U.anim('.coin',[{transform:'translate(0,0)',opacity:1},{transform:'translate(-26px,14px)',opacity:1,offset:.8},{transform:'translate(-26px,14px)',opacity:0}],{duration:U.dur(520),easing:'ease-in'});
      U.later(()=>{U.blip(1500);U.later(()=>U.blip(1900),70)},U.dur(420));
      lcd.textContent='SELECT';
      board();
      U.hint('번호 버튼을 눌러 음료를 골라 보세요.');
    }
    function choose(i){
      if(busy) return;
      if(trayFull){U.hint('먼저 음료를 꺼내 보세요.');return}
      if(credit===0){
        U.blip(420);lcd.textContent='COIN';
        U.anim('#lcd',[{opacity:1},{opacity:.2},{opacity:1}],{duration:U.dur(300),iterations:2});
        U.hint('먼저 동전 넣는 곳(COIN)을 눌러 동전을 넣어 보세요.');return;
      }
      busy=true;U.audio();credit=0;
      cur=i;asked=true;landed=taken=false;board();
      U.talk([0]);
      U.blip();
      lcd.textContent=DR[i].en.toUpperCase();
      const bf=U.art.querySelector(`#fillL .bf${i}`);bf.setAttribute('fill','#FFD23F');
      U.anim(`.bt${i}`,[{transform:'translate(0,0)'},{transform:'translate(.8px,.9px)'},{transform:'translate(0,0)'}],{duration:U.dur(220)});
      U.later(()=>bf.setAttribute('fill','#F7F8F3'),380);
      U.hint('음료가 나오고 있어요…');
      U.later(()=>drop(i),U.dur(900));
    }
    function drop(i){
      (anims[i]||[]).forEach(a=>a.cancel());
      anims[i]=U.anim(`.dc${i}`,[{transform:'translate(0,0)'},{transform:'translate(0,-4px)',offset:.18},{transform:'translate(0,96px)'}],{duration:U.dur(480),easing:'cubic-bezier(.5,0,.9,.6)',fill:'forwards'});
      U.later(()=>land(i),U.dur(470));
    }
    function land(i){
      U.all('#fillL .tcb').forEach(e=>e.setAttribute('fill',DR[i].body));
      U.all('#fillL .tcband').forEach(e=>e.setAttribute('fill',DR[i].band));
      U.all('.tc').forEach(e=>e.setAttribute('opacity','1'));
      U.anim('.tc',[{transform:'translate(0,-30px)'},{transform:'translate(0,2px)',offset:.7},{transform:'translate(0,0)'}],{duration:U.dur(260),easing:'ease-in'});
      U.clunk();
      U.anim('#fig',[{transform:'translate(0,0)'},{transform:'translate(-1.5px,1px)'},{transform:'translate(1.5px,0)'},{transform:'translate(0,0)'}],{duration:U.dur(200)});
      trayFull=true;landed=true;busy=false;
      lcd.textContent='TAKE';
      board();U.talk([1]);
      U.hint('꺼내는 곳(PUSH)을 눌러 음료를 꺼내 보세요.');
      U.later(()=>{
        (anims[i]||[]).forEach(a=>a.cancel());
        anims[i]=U.anim(`.dc${i}`,[{transform:'translate(0,-30px)',opacity:0},{transform:'translate(0,0)',opacity:1}],{duration:U.dur(420),easing:'cubic-bezier(.3,1.4,.6,1)'});
      },U.dur(900));
    }
    function take(){
      if(!trayFull||busy){if(!trayFull)U.hint(credit?'번호 버튼을 눌러 음료를 골라 보세요.':'동전을 넣고 음료를 골라 보세요.');return}
      trayFull=false;taken=true;U.audio();
      board();U.talk([2]);
      const a=U.anim('.tc',[{transform:'translate(0,0)',opacity:1},{transform:'translate(-10px,-40px)',opacity:0}],{duration:U.dur(380),easing:'ease-out',fill:'forwards'});
      a[0].onfinish=()=>{a.forEach(x=>x.cancel());U.all('.tc').forEach(e=>e.setAttribute('opacity','0'))};
      lcd.textContent='THANKS';
      U.later(()=>{if(!trayFull&&credit===0)lcd.textContent='COIN'},1400);
      U.hint('동전을 또 넣고 다른 음료도 골라 보세요.');
    }
    function again(){if(!asked)return;U.audio();U.talk(taken?[0,1,2]:landed?[0,1]:[0])}

    return {
      name:'자판기',nameEn:'vending machine',keys:'키보드 1–4 · C',fillFilter:'hand',
      aria:'음료 4가지가 든 자판기와 대화 전광판. 동전을 넣고 번호 버튼을 누르면 음료가 꺼내는 곳으로 떨어집니다.',
      viewBox:'22 22 522 420',ox:112,oy:300,
      hint0:'동전 넣는 곳(COIN)을 눌러 동전을 넣어 보세요.',
      actions:[
        {id:'coin', en:'Insert a coin',  ko:'동전 넣기'},
        {id:'press',en:'Press a button', ko:'번호 버튼으로 음료 고르기'},
        {id:'take', en:'Take your drink',ko:'음료 꺼내기'},
        {id:'again',en:'Listen again',   ko:'다시 듣기'}
      ],
      draw,
      mount(u){
        U=u;cur=-1;busy=false;trayFull=false;anims={};credit=0;asked=landed=taken=false;
        lcd=U.art.querySelector('#lcd');lcd.textContent='COIN';
        board();U.step(-1);
        if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(U.art.querySelector('#v1r0'))board()});
      },
      onAct(id){({coin,press:()=>choose((cur+1)%4),take,again})[id]()},
      onHit(h){h.id==='trayHit'?take():h.id==='coinHit'?coin():choose(+h.dataset.i)},
      onKey(k){
        if(/^[1-4]$/.test(k)){choose(+k-1);return true}
        if(k==='c'||k==='C'){coin();return true}
      },
      onKo(){board()},
      say:again
    };
  })();

  /* ================= Fig. 02 fitting mirror ================= */
  const mirror=(function(){
    const SKIN='#F4CDA5',HAIRC='#5B3A29',PANTS='#3B4E8C';
    const HAIR=[
      {en:'short straight',ko:'짧은 생머리'},
      {en:'short curly',   ko:'짧은 곱슬머리'},
      {en:'long straight', ko:'긴 생머리'},
      {en:'long curly',    ko:'긴 곱슬머리'}
    ];
    const WEAR=[
      {en:'a yellow T-shirt',ko:'노란 티셔츠',jo:'를',v:'입고',c:'#FFD23F',slot:'#FFE27A'},
      {en:'a green jacket',  ko:'초록 재킷',  jo:'을',v:'입고',c:'#3FA66A',slot:'#A6DDB8'},
      {en:'a red cap',       ko:'빨간 모자',  jo:'를',v:'쓰고',c:'#F15060',slot:'#F7A3AC'},
      {en:'glasses',         ko:'안경',       jo:'을',v:'쓰고',c:'#9BD8F2',slot:'#C7EAF8'}
    ];
    const HB=[[.7,9.45],[2.6,9.45],[.7,11.05],[2.6,11.05]];
    const RX=-3,RZ=10,hangY=i=>3.6+3*i;
    const f=n=>+n.toFixed(2);

    function draw(api){
      const {P,M,el,rect,poly,circ,path,ell,txt,g,gc,hit,K}=api;
      M.mf=api.front(9,2,14);M.mr=api.right(14,2,14);M.mt=api.top(9,1,14);

      /* rug */
      poly('scr',[P(2,2,0),P(8,2,0),P(8,8,0),P(2,8,0)],'#DCE3D3');
      el('scr','polygon',{points:[P(2.5,2.5,0),P(7.5,2.5,0),P(7.5,7.5,0),P(2.5,7.5,0)].map(p=>p.map(f).join(',')).join(' '),'stroke-dasharray':'3 5'},null,{inkOnly:true});

      /* ---- mirror cabinet ---- */
      poly('scr',[P(14,1,0),P(15.4,1,0),P(15.4,2,0),P(14,2,0)],'rgba(30,35,54,.10)',{inkFill:'url(#hatch)'});
      rect('mr',0,0,1,14,'#1F756F');
      rect('mt',0,0,5,1,'#83CFC5');
      rect('mf',0,0,5,14,'#2E9C93');
      rect('mf',0,13,5,1,'#1F756F');
      rect('mf',.45,.45,4.1,1.25,'#FFD23F',{rx:.3});
      txt('mf',2.5,1.42,'LOOK',.95,INK,'Bagel Fat One','letter-spacing=".08"');
      rect('mf',.45,2.0,4.1,6.9,'#F7F8F3',{rx:.25});
      rect('mf',.7,2.25,3.6,6.4,'#CBE6E4',{cls:'gls',fillOnly:true});
      poly('mf',[[1.1,8.65],[1.7,8.65],[3.6,2.25],[3.0,2.25]],'rgba(255,255,255,.55)',{fillOnly:true});
      poly('mf',[[2.0,8.65],[2.25,8.65],[4.15,2.25],[3.9,2.25]],'rgba(255,255,255,.55)',{fillOnly:true});
      el('mf','polygon',{points:'3.3,2.75 3.46,3.24 3.95,3.4 3.46,3.56 3.3,4.05 3.14,3.56 2.65,3.4 3.14,3.24',opacity:0},'#FFFFFF',{cls:'spk'});
      el('mf','polygon',{points:'1.4,6.6 1.5,6.9 1.8,7 1.5,7.1 1.4,7.4 1.3,7.1 1,7 1.3,6.9',opacity:0},'#FFFFFF',{cls:'spk'});
      rect('mf',.7,2.25,3.6,6.4,null,{inkOnly:true});
      /* hair buttons */
      rect('mf',.45,9.2,4.1,3.5,'#E6EBE4',{rx:.25});
      HB.forEach(([u,w],i)=>{
        g(`class="hbt hbt${i}"`);
        rect('mf',u,w,1.7,1.4,'#F7F8F3',{rx:.25,cls:`hbf hbf${i}`});
        const hx=u+.55,hy=w+.78;
        if(i===2){rect('mf',hx-.5,hy-.12,.2,.58,HAIRC);rect('mf',hx+.3,hy-.12,.2,.58,HAIRC)}
        if(i===3)[[-.44,.08],[-.46,.34],[.44,.08],[.46,.34]].forEach(([a,b])=>circ('mf',hx+a,hy+b,.14,HAIRC));
        circ('mf',hx,hy,.36,SKIN);
        if(i%2===0) path('mf',`M${f(hx-.4)},${f(hy+.05)} C${f(hx-.46)},${f(hy-.58)} ${f(hx+.46)},${f(hy-.58)} ${f(hx+.4)},${f(hy+.05)} L${f(hx+.32)},${f(hy-.16)} L${f(hx-.32)},${f(hy-.16)} Z`,HAIRC);
        else [[-.33,-.12],[-.22,-.32],[0,-.4],[.22,-.32],[.33,-.12]].forEach(([a,b])=>circ('mf',hx+a,hy+b,.15,HAIRC));
        txt('mf',u+1.32,w+.98,String(i+1),.55,INK,'DM Mono','font-weight="500"');
        gc();
      });

      /* ---- clothes rack ---- */
      [2.4,13.6].forEach(y=>{
        poly('scr',[P(RX-1.2,y-.2,0),P(RX+1.2,y-.2,0),P(RX+1.2,y+.2,0),P(RX-1.2,y+.2,0)],'#565C72');
        const [x0,y0]=P(RX,y,0),[,y1]=P(RX,y,RZ+.4);
        rect('scr',x0-2,y1,4,y0-y1,'#8D96A8',{rx:1.5});
      });
      [[RZ,1.6],[1.4,1.2]].forEach(([z,t])=>{
        const a=P(RX,2.2,z),b=P(RX,13.8,z);
        poly('scr',[[a[0],a[1]-t],[b[0],b[1]-t],[b[0],b[1]+t],[a[0],a[1]+t]],'#B7C0CF');
      });
      for(let i=0;i<4;i++){
        const [hx,hy]=P(RX,hangY(i),RZ);
        g(`transform="translate(${f(hx)},${f(hy)})"`);
        g(`class="rk rk${i}" style="transform-box:fill-box;transform-origin:50% 0"`);
        path('scr','M0,4 L0,-1 Q0,-6 4,-6 Q8,-6 8,-2',null,{inkOnly:true});
        poly('scr',[[0,4],[17,13],[-17,13]],null,{inkOnly:true});
        circ('scr',-10,-8,5,'#FFD23F');
        txt('scr',-10,-5.3,String(i+5),7.5,INK,'DM Mono','font-weight="500"');
        g(`class="rki rki${i}"`);
        if(i===0){
          path('scr','M-8,8 L0,13 L8,8 L18,12 L26,22 L20,27 L15,22 L15,52 L-15,52 L-15,22 L-20,27 L-26,22 L-18,12 Z',WEAR[0].c);
          path('scr','M-8,8 Q0,17 8,8',null,{inkOnly:true});
        }else if(i===1){
          path('scr','M-8,8 L0,16 L8,8 L18,12 L24,24 L24,54 L18,54 L17,30 L16,58 L-16,58 L-17,30 L-18,54 L-24,54 L-24,24 L-18,12 Z',WEAR[1].c);
          path('scr','M0,16 L0,58 M-12,44 L-5,44 M5,44 L12,44',null,{inkOnly:true});
        }else if(i===2){
          path('scr','M-13,27 C-13,12 13,12 13,27 Z',WEAR[2].c);
          ell('scr',0,27,16,4,'#C93B4A');
          circ('scr',0,14.5,2,WEAR[2].c);
        }else{
          circ('scr',-7,19,6,'rgba(199,234,248,.85)');
          circ('scr',7,19,6,'rgba(199,234,248,.85)');
          path('scr','M-1,18 Q0,16.5 1,18 M-13,18 L-16,13 M13,18 L16,13',null,{inkOnly:true});
        }
        gc();gc();gc();
      }

      /* ---- pedestal ---- */
      const [bx,by]=P(5,5,0),ty=by-1.6*14,rx=1.2247*2.6*14,ry=.7071*2.6*14;
      ell('scr',bx+8,by+4,rx+6,ry+3,'rgba(30,35,54,.10)',{inkFill:'url(#hatch)'});

  const firstAid=(function(){

        M.pk=api.top(8.2,6.4,H);

    function walk(pts,done){
      walking=true;
      const seg=[];let total=0,px=wx,py=wy;
      pts.forEach(([x,y])=>{const l=Math.hypot(x-px,y-py);seg.push([px,py,x,y,l]);total+=l;px=x;py=y});
      const ms=U.dur(total*170);
      const bob=U.anim('.wkb',[{transform:'translate(0,0)'},{transform:'translate(0,-2px)'},{transform:'translate(0,0)'}],{duration:U.dur(260),iterations:Math.max(1,Math.ceil(ms/260))});
      U.tween(ms,t=>{
        let d=t*total;
        for(const [x0,y0,x1,y1,l] of seg){
          if(l>0&&d<=l){const k=d/l;const [ax]=A.P(x0,y0,0),[bx2]=A.P(x1,y1,0);place(x0+(x1-x0)*k,y0+(y1-y0)*k,bx2<ax?-1:1);return}

    /* ---- sounds ---- */
    function tone(freq,at,dur,gain,type='sine',to){

      const o=a.createOscillator(),v=a.createGain(),t=a.currentTime+at;

      v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(gain,t+.01);v.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.connect(v).connect(a.destination);o.start(t);o.stop(t+dur+.05);
    }

  /* ================= Fig. 06 snow globe ================= */

    const CX=200,CY=216,R=100,MY=292;           /* dome centre, radius, snow mound */

      {who:'a',en:'Sounds fun!',ko:'재미있겠다!',pitch:1.05}
    ];

    function draw(api){
      A=api;
      const {rect,poly,circ,path,ell,txt,g,gc,hit,K,F,T,D}=api;
      const limb=(d,c,w)=>{
        K.push(`<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w+3}" stroke-linecap="round" stroke-linejoin="round" style="vector-effect:none"/>`);
        K.push(`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" style="vector-effect:none"/>`);
      };
      const cylP=(cx,ty,by,rx,ry)=>`M${f(cx-rx)},${f(ty)}L${f(cx-rx)},${f(by)}A${f(rx)},${f(ry)} 0 0 0 ${f(cx+rx)},${f(by)}L${f(cx+rx)},${f(ty)}A${f(rx)},${f(ry)} 0 0 0 ${f(cx-rx)},${f(ty)}Z`;

      M.front=api.front(0,D,H);M.right=api.right(W,D,H);M.top=api.top(0,0,H);
      const limb=(d,c,w)=>{
        K.push(`<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w+3}" stroke-linecap="round" stroke-linejoin="round" style="vector-effect:none"/>`);
        K.push(`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" style="vector-effect:none"/>`);
      };

      boardDraw(api,'t7',40,8,328,2,'MY DIARY');

      /* camera body */
      poly('scr',[P(W,0,0),P(W+2.4,0,0),P(W+2.4,D,0),P(W,D,0)],'rgba(30,35,54,.10)',{inkFill:'url(#hatch)'});
      rect('right',0,0,D,H,'#D9818B');
      rect('front',0,0,W,H,'#F7A3AC');
      rect('top',0,0,W,D,'#FBD0D5');
      rect('front',0,4.9,W,1.6,'#F15060');
      for(let i=0;i<5;i++)rect('right',.6+i*.5,5.2,.22,1,'#B9606B',{rx:.1});
      /* lens */
      circ('front',4.5,3,2.3,'#22323C');
      circ('front',4.5,3,1.75,'#3B4E8C');
      circ('front',4.5,3,1.1,'#1A222C');
      circ('front',3.9,2.4,.38,'#FFFFFF',{fillOnly:true});
      /* flash + viewfinder + name */
      rect('front',7.1,.55,1.4,.95,'#FFF4E8',{rx:.15,cls:'flash'});
      rect('front',.6,.55,1.1,.8,'#22323C',{rx:.12});
      txt('front',4.5,6.05,'TRIP CAM',.75,'#FFF4E8','Bagel Fat One','letter-spacing=".06"');
      /* date LCD on the side */
      rect('right',.7,1,4.6,1.3,'#22323C',{rx:.15});
      T.push(`<text id="lcd7" transform="${M.right}" x="3" y="1.88" font-size=".56" fill="#8EF0B0" font-family="DM Mono" text-anchor="middle" letter-spacing=".04">SET DATE</text>`);
      /* top: photo slot, date dial, shutter */
      rect('top',1.4,.5,6.2,.5,'#22323C',{rx:.12});
      M.dial=`${M.top} rotate(0,2.2,3.4)`;
      circ('top',2.2,3.4,1.25,'#F7F8F3');
      circ('dial',2.2,3.4,.8,'#E6EBE4',{cls:'dlk'});
      rect('dial',2.08,2.5,.24,.9,'#F15060',{cls:'dlk',rx:.1});
      const [bx,by]=P(7,4.3,H);
      g('class="shut"');
        path('scr',`M${f(bx-12)},${f(by)} L${f(bx-12)},${f(by-7)} A12,6 0 0 1 ${f(bx+12)},${f(by-7)} L${f(bx+12)},${f(by)} A12,6 0 0 1 ${f(bx-12)},${f(by)} Z`,'#F15060');
        ell('scr',bx,by-7,12,6,'#FF8A96');
      gc();
      /* strap lug */
      limb(`M${f(P(0,D,H-1)[0])},${f(P(0,D,H-1)[1])} q-18,10 -14,40`,'#3B4E8C',3);

      /* the instant photo (screen space) */
      g(`class="photo" style="transform-box:fill-box;transform-origin:50% 50%;opacity:0"`);
        g('class="pfront"');
          rect('scr',CX-80,CY-95,160,190,'#FFFFFF',{rx:3});
          g(`transform="translate(${PX},${PY})"`);
            /* 0 beach */
            g('class="ph ph0"');
              rect('scr',0,0,140,130,'#CFE8EF');
              circ('scr',112,26,13,'#FFD23F');
              rect('scr',0,70,140,26,'#4F86D9');
              path('scr','M0,82 q10,-4 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0',null,{inkOnly:true});
              rect('scr',0,96,140,34,'#FFE27A');
              limb('M42,122 L42,80','#8C6A3F',2);
              path('scr','M18,82 A24,16 0 0 1 66,82 Z','#F15060');
              path('scr','M34,82 Q42,66 50,82','#FFFFFF');
              ell('scr',100,118,14,4,'#F7A3AC');
            gc();
            /* 1 ice cream */
            g('class="ph ph1"');
              rect('scr',0,0,140,130,'#FBD0D5');
              poly('scr',[[70,124],[54,78],[86,78]],'#E8C49A');
              path('scr','M58,88 L80,104 M62,100 L76,112 M82,88 L60,104',null,{inkOnly:true});
              circ('scr',70,68,18,'#F7A3AC');
              circ('scr',70,44,15,'#A6DDB8');
              circ('scr',72,26,5,'#F15060');
              limb('M72,22 Q76,14 82,12','#3B4E8C',1.4);
            gc();
            /* 2 whale */
            g('class="ph ph2"');
              rect('scr',0,0,140,130,'#CFE8EF');
              rect('scr',0,62,140,68,'#4F86D9');
              path('scr','M30,84 Q70,52 110,82 Q96,104 52,102 Q30,100 30,84 Z','#3A6AB3');
              path('scr','M108,80 L128,66 L124,84 L132,96 Z','#3A6AB3');
              circ('scr',50,82,2,null,{inkOnly:true,inkFill:INK});
              path('scr','M70,58 Q66,44 58,40 M70,58 Q72,42 70,34 M70,58 Q76,44 84,40',null,{inkOnly:true});
              path('scr','M14,58 L32,58 L28,64 L18,64 Z','#F7F8F3');rect('scr',22,44,2,14,'#8C6A3F');poly('scr',[[24,44],[24,54],[33,54]],'#FFFFFF');
            gc();
            /* 3 soccer */
            g('class="ph ph3"');
              rect('scr',0,0,140,130,'#CFE8EF');
              rect('scr',0,70,140,60,'#7CCB7E');
              path('scr','M0,100 L140,100 M70,70 L70,130',null,{inkOnly:true});
              limb('M104,96 L104,64 L132,64 L132,96','#FFFFFF',2.4);
              path('scr','M110,64 L110,96 M118,64 L118,96 M126,64 L126,96 M104,75 L132,75 M104,86 L132,86',null,{inkOnly:true});
              limb('M44,104 L44,84 M50,104 L58,92 L66,96','#3B4E8C',4);
              rect('scr',38,64,16,21,'#FFD23F',{rx:4});
              circ('scr',46,55,8,'#F4CDA5');
              path('scr','M38,54 C37,43 55,43 54,54 L52,50 L40,50 Z','#5B3A29');
              circ('scr',80,98,7,'#FFFFFF');
            gc();
            K.push(`<rect class="dev" x="0" y="0" width="140" height="130" fill="#3B3F52" opacity="0"/>`);
          gc();
          rect('scr',PX,PY,140,130,null,{inkOnly:true});
        gc();
        g('class="pback" style="display:none"');
          rect('scr',CX-80,CY-95,160,190,'#FFF4E8',{rx:3});
          K.push(`<text id="pb0" x="${CX}" y="${CY-30}" font-size="26" font-family="Andika" font-weight="700" fill="#565C72" text-anchor="middle" stroke="none">go</text>`);
          K.push(`<path d="M${CX},${CY-18} L${CX},${CY+4} M${CX-7},${CY-4} L${CX},${CY+4} L${CX+7},${CY-4}" fill="none" stroke="#F15060" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vector-effect:none"/>`);
          K.push(`<text id="pb1" x="${CX}" y="${CY+40}" font-size="30" font-family="Andika" font-weight="700" fill="${INK}" text-anchor="middle" stroke="none">went</text>`);
        gc();
      gc();
      T.push(`<text id="pbk" x="${CX}" y="${CY+76}" font-size="11" font-family="Gowun Dodum" fill="#565C72" text-anchor="middle" opacity="0"></text>`);
      T.push(`<rect class="flash7" x="0" y="0" width="600" height="500" fill="#FFFFFF" opacity="0" pointer-events="none"/>`);

      /* hit areas */
      hit('scr',`data-k="board" tabindex="-1" aria-hidden="true" x="40" y="8" width="328" height="104"`);
      hit('top',`data-k="dial" tabindex="0" role="button" aria-label="날짜 다이얼 돌리기" x=".8" y="2" width="2.8" height="2.8"`);
      hit('scr',`data-k="shut" tabindex="0" role="button" aria-label="셔터 누르기" x="${f(bx-16)}" y="${f(by-18)}" width="32" height="26"`);
      hit('front',`data-k="lens" tabindex="-1" aria-hidden="true" x="2" y=".5" width="5" height="5"`);
      hit('scr',`data-k="photo" tabindex="0" role="button" aria-label="사진 뒤집기" x="${CX-80}" y="${CY-95}" width="160" height="190"`);
    }

    /* ---- state → drawing ---- */
    function board(){
      boardSet(U,'t7',[
        {who:'a',parts:when<0?['What did you do ____?']:['What did you do ',{s:WHEN[when].en,c:'#C9DBF5'},'?'],ko:when<0?'':`너는 ${WHEN[when].ko} 무엇을 했니?`,on:when>=0},
        {who:'b',parts:shot<0?['I ____.']:['I ',{s:SHOT[shot].past,c:'#F7A3AC'},SHOT[shot].rest],ko:shot<0?'':`나는 ${SHOT[shot].ko}.`,on:shot>=0}
      ]);
      U.lines(lines());
      U.acts(id=>id==='dial'||(when>=0&&(id==='shutter'||id==='again'))||(id==='flip'&&shot>=0));
    }
    function setDial(deg){U.all('.dlk').forEach(e=>e.setAttribute('transform',`${A.M.top} rotate(${f(deg)},2.2,3.4)`))}
    function photoSide(b){
      back=b;U.show('.pfront',!b);U.show('.pback',b);
      const k=U.art.querySelector('#pbk');k.setAttribute('opacity',b&&U.isKo()?1:0);
    }

    /* ---- sounds ---- */
    function tone(freq,at,dur,gain,type='sine'){
      const a=U.audio();if(!a)return;
      const o=a.createOscillator(),v=a.createGain(),t=a.currentTime+at;
      o.type=type;o.frequency.value=freq;
      v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(gain,t+.01);v.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.connect(v).connect(a.destination);o.start(t);o.stop(t+dur+.05);
    }
    const click=()=>{U.blip(2200);U.later(()=>U.blip(1400),60)};
    const whirr=()=>{for(let i=0;i<10;i++)tone(300+i*18,i*.06,.08,.04,'square')};

    /* ---- what the camera does ---- */
    function nudge(sel,msg){U.blip(420);U.anim(sel,[{opacity:1},{opacity:.3},{opacity:1}],{duration:U.dur(500)});U.hint(msg)}
    let dialDeg=0;
    function dial(){
      U.audio();when=(when+1)%3;
      for(let i=0;i<3;i++)U.later(()=>U.blip(1600),i*50);
      const d0=dialDeg;dialDeg+=120;
      U.tween(U.dur(300),t=>setDial(d0+(dialDeg-d0)*t));
      U.art.querySelector('#lcd7').textContent=WHEN[when].lcd;
      board();U.talk([0]);
      U.hint(shot<0?'셔터를 눌러 사진을 찍어 보세요.':'셔터를 누르면 다른 사진이 나와요.');
    }
    function shutter(){
      if(when<0){nudge('.dlk','먼저 날짜 다이얼을 돌려 언제인지 물어보세요.');return}
      if(busy)return;busy=true;U.audio();
      shot=(shot+1)%4;photoSide(false);
      click();
      U.anim('.shut',[{transform:'translate(0,0)'},{transform:'translate(0,3px)'},{transform:'translate(0,0)'}],{duration:U.dur(200)});
      U.anim('.flash7',[{opacity:0},{opacity:.85,offset:.15},{opacity:0}],{duration:U.dur(450)});
      U.show('.ph',false);U.show('.ph'+shot,true);
      U.later(whirr,U.dur(250));
      const [sx0,sy0]=A.P(4.5,.8,H),dx=f(sx0-CX),dy=f(sy0-CY);
      U.all('.photo').forEach(e=>e.style.opacity='1');
      U.anim('.photo',[
        {transform:`translate(${dx}px,${dy}px) scale(.2)`,opacity:0},
        {transform:`translate(${dx}px,${f(dy-40)}px) scale(.3)`,opacity:1,offset:.35},
        {transform:'translate(0,0) scale(1) rotate(3deg)',opacity:1}
      ],{duration:U.dur(1000),easing:'ease-out',fill:'forwards'});
      U.anim('.dev',[{opacity:1},{opacity:1,offset:.4},{opacity:0}],{duration:U.dur(1800),fill:'forwards'});
      U.later(()=>{busy=false;board();U.talk([1,2])},U.dur(1300));
      U.hint('사진을 누르면 뒤집혀서 원래 동사가 보여요.');
    }
    function flip(){
      if(shot<0){nudge('.shut','먼저 셔터를 눌러 사진을 찍어 보세요.');return}
      if(busy)return;U.audio();U.blip(900);
      const s=SHOT[shot];
      U.art.querySelector('#pb0').textContent=s.base;
      U.art.querySelector('#pb1').textContent=s.past;
      U.art.querySelector('#pbk').textContent=s.bko;
      U.anim('.photo',[{transform:'translate(0,0) scale(1) rotate(3deg)'},{transform:'translate(0,0) scaleX(0) rotate(3deg)',offset:.5},{transform:'translate(0,0) scale(1) rotate(3deg)'}],{duration:U.dur(420),fill:'forwards'});
      U.later(()=>photoSide(!back),U.dur(210));
      U.hint(back?'사진 앞면이에요.':`${s.base}의 과거형: ${s.past}`);
    }
    function again(){if(when<0){nudge('.dlk','먼저 날짜 다이얼을 돌려 물어보세요.');return}U.audio();U.talk(shot<0?[0]:[0,1])}

    return {
      name:'여행 사진기',nameEn:'travel camera',keys:'키보드 1–4',fillFilter:'hand',
      aria:'즉석 사진기와 일기판. 날짜 다이얼을 돌려 언제인지 묻고, 셔터를 눌러 사진을 뽑고, 사진을 뒤집어 동사의 원래 모양을 봅니다.',
      viewBox:'30 0 452 366',ox:133,oy:224,
      hint0:'사진기 위의 날짜 다이얼을 돌려 물어보세요.',
      actions:[
        {id:'dial',   en:'Turn the dial',    ko:'날짜 다이얼 돌려 언제인지 고르기'},
        {id:'shutter',en:'Press the shutter',ko:'셔터 눌러 사진 뽑기'},
        {id:'flip',   en:'Flip the photo',   ko:'사진 뒤집어 원래 동사 보기'},
        {id:'again',  en:'Listen again',     ko:'다시 듣기'}
      ],
      draw,
      mount(u){
        U=u;when=-1;shot=-1;back=false;busy=false;dialDeg=0;
        setDial(0);photoSide(false);board();U.step(-1);
        if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(U.art.querySelector('#t7r0'))board()});
      },
      onAct(id){({dial,shutter,flip,again})[id]()},
      onHit(h){({dial,shut:shutter,lens:shutter,photo:flip,board:()=>when<0?dial():again()})[h.dataset.k]()},
      onKey(k){const m={'1':dial,'2':shutter,'3':flip,'4':again}[k];if(m){m();return true}},
      onKo(){board();photoSide(back)},
      say:again
    };
  })();

  /* ================= fig switching ================= */
  const ROAD=['자판기','탈의실 거울','회전무대','구급상자','미니 마을','스노볼','여행 사진기','푸드트럭','알람시계','냉장고','계산대','창문'];
  const BUILT={0:vending,1:mirror,2:musicStage,3:firstAid,4:miniTown,5:snowGlobe,6:tripCam};
  const builtIdx=Object.keys(BUILT).map(Number);
  let fig=null,figIdx=0;
  const num=i=>String(i+1).padStart(2,'0');

  function buildActs(f){
    $('acts').innerHTML=f.actions.map(a=>`<button type="button" class="act" data-act="${a.id}"><span>${a.en}</span><small>${a.ko}</small></button>`).join('')
      +`<button type="button" class="act mini" data-act="ko" aria-pressed="${koOn}">${koOn?'한글 뜻 숨기기':'한글 뜻 보기'}</button>`;
  }
  function go(i){
    if(!BUILT[i]) return;
    flush();
    fig=BUILT[i];figIdx=i;
    const api=Iso(fig.ox,fig.oy,fig.fillFilter);fig.draw(api);
    art.setAttribute('viewBox',fig.viewBox);
    art.setAttribute('aria-label',fig.aria);
    art.innerHTML=api.svg();
    art.querySelectorAll('#inkL text').forEach(t=>t.setAttribute('stroke','none'));
    $('plate').setAttribute('aria-label',`${fig.name} 그림`);
    $('capName').innerHTML=`<b>Fig. ${num(i)}</b> — ${fig.name} · ${fig.nameEn}`;
    $('capKeys').textContent=fig.keys;
    ui.hint(fig.hint0);
    stepN=-1;
    buildActs(fig);
    fig.mount(ui);
    $('pgNum').textContent=`Fig. ${num(i)} / 12`;
    const k=builtIdx.indexOf(i);
    $('prev').disabled=k<=0;$('next').disabled=k>=builtIdx.length-1;
    $('index').innerHTML=ROAD.map((n,j)=>BUILT[j]
      ?`<button type="button" class="ix${j===i?' cur':''}" data-fig="${j}"${j===i?' aria-current="page"':''}><i>${num(j)}</i>${n}</button>`
      :`<span><i>${num(j)}</i>${n}</span>`).join('');
    try{history.replaceState(null,'',`#fig${num(i)}`)}catch(e){}
  }
  function step(d){const k=builtIdx.indexOf(figIdx)+d;if(k>=0&&k<builtIdx.length)go(builtIdx[k])}

  /* ---- events (bound once, dispatched to the current fig) ---- */
  art.addEventListener('click',e=>{const h=e.target.closest('.hit');if(h)fig.onHit(h)});
  art.addEventListener('keydown',e=>{
    const h=e.target.closest('.hit');if(!h||(e.key!=='Enter'&&e.key!==' '))return;
    e.preventDefault();fig.onHit(h);
  });
  $('acts').addEventListener('click',e=>{
    const b=e.target.closest('.act');if(!b||b.disabled)return;
    const id=b.dataset.act;
    if(id==='ko'){koOn=!koOn;b.setAttribute('aria-pressed',koOn);b.textContent=koOn?'한글 뜻 숨기기':'한글 뜻 보기';fig.onKo&&fig.onKo(koOn);return}
    audio();fig.onAct(id);
  });
  $('prev').addEventListener('click',()=>step(-1));
  $('next').addEventListener('click',()=>step(1));
  $('index').addEventListener('click',e=>{const b=e.target.closest('[data-fig]');if(b)go(+b.dataset.fig)});
  document.addEventListener('keydown',e=>{
    if((e.target.closest&&e.target.closest('input,textarea'))||e.altKey||e.ctrlKey||e.metaKey)return;
    if(fig.onKey(e.key)){e.preventDefault();return}
    if(e.key==='ArrowLeft'){step(-1);return}
    if(e.key==='ArrowRight'){step(1);return}
  });
  function fromHash(){const m=/^#fig(\d\d)$/.exec(location.hash);const i=m?+m[1]-1:0;return BUILT[i]?i:0}
  window.addEventListener('hashchange',()=>{const i=fromHash();if(i!==figIdx)go(i)});
  go(fromHash());
})();
</script>
</body>
</html>
